<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>National Forensic Association | Welcome</title>
  <style>
    :root {
      --navy: #0B1B3D;
      --navy-dark: #050E21;
      --crimson: #8B0000;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --white: #FFFFFF;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, rgba(11, 27, 61, 0.94) 0%, rgba(5, 14, 33, 0.96) 100%);
      color: var(--white);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .sans {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #splash-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
    }

    .splash-crest {
      width: 180px;
      height: 180px;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
      animation: gentle-glow 4s ease-in-out infinite alternate;
    }

    @keyframes gentle-glow {
      0% { filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3)); }
      100% { filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.6)); }
    }

    .splash-subtitle {
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gold);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      font-weight: bold;
    }

    .splash-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      margin-bottom: 1.25rem;
      line-height: 1.2;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .splash-desc {
      max-width: 650px;
      color: #cbd5e1;
      margin-bottom: 2rem;
      font-size: 1.05rem;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .splash-actions {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-gold {
      background: linear-gradient(135deg, #E5C349 0%, #D4AF37 100%);
      color: var(--navy-dark);
      border: none;
      padding: 1rem 2.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #F3E5AB 0%, #E5C349 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.55);
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="cropped-nfa-red-bubble.png" alt="National Forensic Association Logo" class="splash-crest" />

    <p class="splash-subtitle">Established 1971 • National Championship Hub</p>
    <h1 class="splash-title">NATIONAL FORENSIC ASSOCIATION</h1>
    <p class="splash-desc">
      Empowering the voices of collegiate speech and debate across the nation. Experience the redesigned digital home for tournaments, scholarly research, and archives.
    </p>
    
    <div class="splash-actions sans">
      <a href="home.html" class="btn-gold">ENTER WEBSITE</a>
    </div>
  </div>

</body>
</html>
